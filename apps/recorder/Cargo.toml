# Part of Agent Record Adapter (see NOTICE).
[package]
name = "desktop-recorder"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "A small desktop app that records a task and turns it into a script that repeats it, without AI. Part of Agent Record Adapter."
publish = false

[[bin]]
name = "desktop-recorder"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
egui_extras = { version = "0.33", default-features = false, features = ["svg"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
