# Part of Agent Record Adapter (see NOTICE).
[package]
name        = "agent-record-browser"
description = "Drives web pages through the unmodified agent-browser, in the background, behind a DevTools proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json.workspace = true
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
futures-util      = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
