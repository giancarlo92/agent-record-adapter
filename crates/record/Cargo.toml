# Part of Agent Record Adapter (see NOTICE).
[package]
name        = "agent-record-core"
description = "Platform-neutral part of Agent Record Adapter: background switch, recording format, secrets and our commands"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agent-desktop-core.workspace = true
serde.workspace              = true
serde_json.workspace         = true
tracing.workspace            = true

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[lints]
workspace = true
