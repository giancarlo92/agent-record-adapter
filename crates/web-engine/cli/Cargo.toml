# Part of Agent Record Adapter (see NOTICE).
# agent-browser, from its unmodified sources (vendor/agent-browser/cli/src), as
# a library carried inside agent-record.exe. Nothing here is a copy: the build
# script points upstream's main.rs and its modules at the submodule (see
# crates/embed_root.rs). This folder sits one level down (web-engine/cli) so
# upstream's paths relative to its package ("../packages/dashboard/out") land
# in web-engine/packages, which the build script fills.
# Generated by scripts/sync_web_engine.py from vendor/agent-browser/cli/Cargo.toml:
# never edit by hand.
[package]
name    = "agent-record-web-engine"
version = "0.44.0"
edition = "2021"
license = "Apache-2.0"
publish = false
build   = "build.rs"

[lib]
name = "agent_record_web_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
getrandom = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "0.26"
futures-util = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
sha2 = "0.10"
aes-gcm = "0.10"
async-trait = "0.1"
socket2 = "0.6"
similar = "2"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["formatting"] }
hmac = "0.12"
hex = "0.4"
chrono = "0.4"
urlencoding = "2"
rust-embed = "8"
psl = "=2.1.246"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi"] }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
