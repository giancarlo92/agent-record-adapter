# Part of Agent Record Adapter (see NOTICE).
[package]
name        = "agent-record-windows"
description = "Background-first layer around the unmodified agent-desktop Windows adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Our core under core's name: it re-exports all of agent-desktop-core plus our
# own types, so the code ported from the old fork keeps its paths.
agent-desktop-core           = { package = "agent-record-core", path = "../record" }
upstream-windows.workspace   = true
serde_json.workspace         = true
tracing.workspace            = true

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = { version = "0.25", default-features = false, features = ["control", "input"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
