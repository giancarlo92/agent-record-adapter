# Part of Agent Record Adapter (see NOTICE).
# The agent-desktop CLI and MCP server, built from upstream's own unmodified
# sources (vendor/agent-desktop/src), with our adapter under upstream's crate
# name. Nothing here is a copy: the bin and test paths point into the submodule.
[package]
name    = "agent-record-engine"
# Kept equal to the upstream workspace version (scripts/update-upstream.ps1).
version = "1.3.1"
edition.workspace = true
license.workspace = true
publish = false
autotests = false
autobins  = false
build     = "build.rs"

[dependencies]
agent-desktop-core.workspace = true
base64.workspace             = true
clap.workspace               = true
serde.workspace              = true
serde_json.workspace         = true
thiserror.workspace          = true
tracing.workspace            = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
agent-desktop-windows = { package = "agent-record-windows", path = "../windows-adapter" }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

[lib]
name = "agent_record_engine"
path = "src/lib.rs"

[[bin]]
name = "agent-desktop"
path = "../../vendor/agent-desktop/src/main.rs"

[lints]
workspace = true
