<!doctype html><html><head><meta charset="utf-8"><title>File pick test</title></head>
<!-- Part of Agent Record Adapter (see NOTICE). Ported from the desktop-recorder-mcp fork. -->
<body><h1>File pick test</h1>
<label for="f">Archivo</label> <input id="f" type="file">
<p id="out">none</p>
<script>document.getElementById('f').addEventListener('change',e=>{document.getElementById('out').textContent='picked: '+[...e.target.files].map(f=>f.name).join(',');document.title='File pick test - picked';});</script>
</body></html>
